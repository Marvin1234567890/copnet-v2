<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>COPNET V2 – Polizei NRW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="copnet">

        <div class="topbar">
            <div class="topbar-left">
                <div class="logo-circle">NRW</div>
                <div>
                    <div class="topbar-title">Landespolizei Nordrhein-Westfalen</div>
                    <div class="topbar-sub">COPNET V2 – Einsatz- und Fahndungssystem</div>
                </div>
            </div>
            <div class="topbar-right">
                <span class="status-pill status-ok">System online</span>
            </div>
        </div>
<div class="topbar-right">
    <span class="status-pill status-ok">System online</span>
    <button class="mode-toggle" onclick="toggleMode()">🌓 Modus</button>
</div>

        <div id="tabs">
            <button onclick="setTab('persons')">👤 Personen</button>
            <button onclick="setTab('vehicles')">🚗 Fahrzeuge</button>
            <button onclick="setTab('wanted')">📛 Fahndung</button>
            <button onclick="setTab('dispatch')">📞 Einsätze</button>
            <button onclick="setTab('duty')">🛡 Dienst</button>
            <button onclick="setTab('internal')">📂 Ermittlungen</button>
            <button onclick="setTab('admin')">⚙ Admin</button>
        </div>

        <div id="content"></div>

        <button id="close" onclick="closeNUI()">Tablet schließen</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
<button onclick="setTab('admin')">⚙ Admin</button>
