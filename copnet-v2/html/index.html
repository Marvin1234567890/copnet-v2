<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>COPNET V2 – NRW Polizei Tablet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
</head>
<body>
    <div id="copnet" class="tablet">
        <div class="topbar">
            <div class="topbar-left">
                <span class="logo">COPNET V2</span>
                <span class="subtitle">NRW Polizei System</span>
            </div>
            <div class="topbar-right">
                <span class="status-pill status-ok">System online</span>
                <select id="themeSelector" onchange="changeTheme(this.value)">
                    <option value="theme-nrw">NRW Polizei</option>
                    <option value="theme-glass">iPad Glass</option>
                    <option value="theme-material">Material</option>
                    <option value="theme-windows">Windows 10</option>
                    <option value="theme-cyber">Cyber Police</option>
                </select>
                <button class="mode-toggle" onclick="toggleMode()">🌓 Modus</button>
            </div>
        </div>

        <div class="tabs">
            <button onclick="setTab('persons')">👤 Personen</button>
            <button onclick="setTab('vehicles')">🚗 Fahrzeuge</button>
            <button onclick="setTab('wanted')">📛 Fahndung</button>
            <button onclick="setTab('dispatch')">📞 Einsätze</button>
            <button onclick="setTab('duty')">🛡 Dienst</button>
            <button onclick="setTab('internal')">📂 Intern</button>
            <button onclick="setTab('admin')">⚙ Admin</button>
        </div>

        <div id="content"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>

</html>
<button onclick="setTab('admin')">⚙ Admin</button>
